name: Build and publish

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  publish:
    name: Publish image
    runs-on: ubuntu-latest
    concurrency:
      group: publish-image
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Resolve next version
        id: version
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          owner="${GITHUB_REPOSITORY%%/*}"
          pkg="${GITHUB_REPOSITORY#*/}"
          : > /tmp/published-tags
          for path in "/orgs/${owner}/packages/container/${pkg}/versions" "/users/${owner}/packages/container/${pkg}/versions"; do
            if gh api --paginate --jq '.[] | .metadata.container.tags[]? // empty' "$path" >> /tmp/published-tags 2>/dev/null; then
              break
            fi
          done
          url="https://hub.docker.com/v2/repositories/snellocms/${pkg}/tags?page_size=100"
          while [ -n "$url" ]; do
            body=$(curl -fsS "$url" || true)
            [ -z "$body" ] && break
            printf '%s\n' "$body" | jq -r '.results[].name' >> /tmp/published-tags
            url=$(printf '%s' "$body" | jq -r '.next // empty')
          done
          current=$(grep -E '^[0-9]+\.[0-9]+\.[0-9]+$' /tmp/published-tags | sort -V | tail -1 || true)
          if [ -z "$current" ]; then
            next="0.0.1"
          else
            major=${current%%.*}
            rest=${current#*.}
            minor=${rest%%.*}
            patch=${current##*.}
            next="${major}.${minor}.$((patch + 1))"
          fi
          printf "export const APP_VERSION = '%s';\n" "$next" > src/app/version.ts
          echo "version=${next}" >> "$GITHUB_OUTPUT"
          echo "Next version ${next} (previous ${current:-none})"

      - name: Build the app
        run: npm ci && npm run build

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Resolve image tags
        id: tags
        env:
          DOCKER_HUB_USERNAME: ${{ secrets.DOCKER_HUB_USERNAME }}
          DOCKER_HUB_ACCESS_TOKEN: ${{ secrets.DOCKER_HUB_ACCESS_TOKEN }}
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          if [ -z "$VERSION" ]; then
            echo "Could not read APP_VERSION" >&2
            exit 1
          fi
          if [ -n "$DOCKER_HUB_USERNAME" ] && [ -n "$DOCKER_HUB_ACCESS_TOKEN" ]; then
            echo "dockerhub=true" >> "$GITHUB_OUTPUT"
          else
            echo "dockerhub=false" >> "$GITHUB_OUTPUT"
          fi
          {
            echo "tags<<EOF"
            echo "ghcr.io/${{ github.repository }}:${VERSION}"
            echo "ghcr.io/${{ github.repository }}:latest"
            if [ -n "$DOCKER_HUB_USERNAME" ] && [ -n "$DOCKER_HUB_ACCESS_TOKEN" ]; then
              echo "snellocms/snello-layouts:${VERSION}"
              echo "snellocms/snello-layouts:latest"
            fi
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Login to DockerHub
        if: steps.tags.outputs.dockerhub == 'true'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_HUB_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_ACCESS_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./docker/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.tags.outputs.tags }}
